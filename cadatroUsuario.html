<html> 

    <head>

        <title>Formulário</title>
        <link rel="stylesheet" href="css/style.css">

    </head>

    <body class="fundoSecundario">

        <header>
            <img src="img/header_weblocadora.jpg" alt="Banner da Locadora" class="banner">
        </header>
        

        <div class="form">

            <form name = "Formulario">


                <h1 class="logo">Cadastro de Usuários</h1><br>

                <label>Nome: </label><input style="border-radius: 5px" type = "text" name = "nome" size = "100"><br><br>

                <label>Endereço: </label><input type = "text" name = "endereco" size = "100"><br><br>

                <label>E-Mail: </label><input type = "text" name = "email" size = "100"><br><br>

                <label>Cidade: </label><input type = "text" name = "cidade" size = "100"><br><br>

                <label >Estado: </label><select name = "estado" > 
                
                    <option value = "AC"> Acre</option>
                
                    <option value = "AL"> Alagoas</option>
                
                    <option value = "AP"> Amapá</option>
                
                    <option value = "AM"> Amazonas</option>
                
                    <option value = "BA"> Bahia</option>
                
                    <option value = "CE"> Ceará</option>
                    
                    <option value = "ES"> Espírito Santo</option>
                
                    <option value = "GO"> Goiás</option>
                
                    <option value = "MA"> Maranhão</option>
                    
                    <option value = "MT"> Mato Grosso</option>
                    
                    <option value = "MS"> Mato Grosso Do Sul</option>
                    
                    <option value = "MG"> Minas Gerais</option>
                    
                    <option value = "PA"> Pará</option>
                
                    <option value = "PB"> Paraíba</option>
                
                    <option value = "PR"> Paraná</option>
                    
                    <option value = "PE"> Pernambuco</option>
                
                    <option value = "PI"> Piauí</option>
                    
                    <option value = "RJ"> Rio De Janeiro</option>
                    
                    <option value = "RN"> Rio Grande Do Norte</option>

                    <option value = "RS"> Rio Grande Do Sul</option>
                    
                    <option value = "RO"> Rondônia</option>
                    
                    <option value = "RR"> Roraima</option>

                    <option value = "SC"> Santa Catarina</option>

                    <option value = "SP" selected> São Paulo</option>

                    <option value = "SE"> Sergipe</option>
                
                    <option value = "TO"> Tocantins</option>
                    
                </select><br><br>


                <label>Sexo: </label>

                <input type = "radio" name = "sex" value = "masculino" checked="true"> Masculino
                <input type = "radio" name = "sex" value = "feminino"> Feminino<br><br>

                <label>Escolha os filmes que você mais gosta </label><br><br>

                <input type = "checkbox" name = "movieType" value = "acao"> Ação<br>
                <input type = "checkbox" name = "movieType" value = "aventura"> Aventura<br>
                <input type = "checkbox" name = "movieType" value = "comedia"> Comédia<br>
                <input type = "checkbox" name = "movieType" value = "suspense"> Suspense<br>
                <input type = "checkbox" name = "movieType" value = "drama"> Drama<br>
                <input type = "checkbox" name = "movieType" value = "romance"> Romance<br>
                <input type = "checkbox" name = "movieType" value = "terror"> Terror<br><br><br>


                <label>Usuário: </label><input type = "text" name = "user" size = "50"><br><br>

                <label>Senha: </label><input type = "password" name = "login" size = "50"><br><br>

                <input type="button" name="enviar" value="Cancelar">
                <input type="reset" name="limpar" value="Limpar">
                <input type="submit" name="nada" value="Cadastrar"><br>

                <a href="mainPage.html"> voltar </a>

            </form>
        
        </div>

    </body>

    
</html>
