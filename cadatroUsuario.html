<html> 

    <head>

        <title>Formulário</title>
        <link rel="stylesheet" href="css/style.css">

    </head>

    <body>

        <form name = "Formulario">


                <h1>Cadastro de Usuários</h1>

                <label>Nome: </label><input type = "text" name = "nome" size = "100"><br>

                <label>Endereço: </label><input type = "text" name = "endereco" size = "100"><br>

                <label>E-Mail: </label><input type = "text" name = "email" size = "100"><br>

                <label>Cidade: </label><input type = "text" name = "cidade" size = "50"><br>

                <select name = "estado" >
                
                    <option value = "AC"> Acre</option>
                
                    <option value = "AL"> Alagoas</option>
                
                    <option value = "AP"> Amapá</option>
                
                    <option value = "AM"> Amazonas</option>
                
                    <option value = "BA"> Bahia</option>
                
                    <option value = "CE"> Ceará</option>
                    
                    <option value = "ES"> Espírito Santo</option>
                
                    <option value = "GO"> Goiás</option>
                
                    <option value = "MA"> Maranhão</option>
                    
                    <option value = "MT"> Mato Grosso</option>
                    
                    <option value = "MS"> Mato Grosso Do Sul</option>
                    
                    <option value = "MG"> Minas Gerais</option>
                    
                    <option value = "PA"> Pará</option>
                
                    <option value = "PB"> Paraíba</option>
                
                    <option value = "PR"> Paraná</option>
                    
                    <option value = "PE"> Pernambuco</option>
                
                    <option value = "PI"> Piauí</option>
                    
                    <option value = "RJ"> Rio De Janeiro</option>
                    
                    <option value = "RN"> Rio Grande Do Norte</option>

                    <option value = "RS"> Rio Grande Do Sul</option>
                    
                    <option value = "RO"> Rondônia</option>
                    
                    <option value = "RR"> Roraima</option>

                    <option value = "SC"> Santa Catarina</option>

                    <option value = "SP" selected> São Paulo</option>

                    <option value = "SE"> Sergipe</option>
                
                    <option value = "TO"> Tocantins</option>
                    


            <fieldset>

                <legend>Dados Profissionais</legend>

                <label>Natureza do Cargo</label>

                <input type = "radio" name = "Dado" value = "gerencia"> Gerência<br>
                <input type = "radio" name = "Dado" value = "financeiro"> Financeiro<br>
                <input type = "radio" name = "Dado" value = "recepcao"> Recepção<br>
                <input type = "radio" name = "Dado" value = "administrativo"> administrativo<br>
                <input type = "radio" name = "Dado" value = "juridico"> Jurídico

                <label>Área de interesse</label>

                <input type = "radio" name = "Dado" value = "computacao"> Computação<br>
                <input type = "radio" name = "Dado" value = "biologia"> Biologia<br>
                <input type = "radio" name = "Dado" value = "meio ambiente"> Meio Ambiente<br>
                <input type = "radio" name = "Dado" value = "engenharia"> Engenharia<br>
                <input type = "radio" name = "Dado" value = "historia"> História

            </fieldset>

        </form>
        

    </body>

    
</html>
